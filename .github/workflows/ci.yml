name: ci

# Legacy Pix is retired here (it moved into marsh), so this only re-tests its
# frozen formula when someone changes it. marsh's formulas are tested by
# marsh's own release pipeline.
on:
  pull_request:
    paths: [Formula/pix.rb, .github/workflows/ci.yml]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Register this checkout as a tap
        run: brew tap local/pix-ci "$GITHUB_WORKSPACE"
      - name: Verify explicit version matches both architecture URLs
        run: |
          set -euo pipefail
          v="$(grep -oE 'version "[0-9.]+"' Formula/pix.rb | grep -oE '[0-9.]+')"
          test "$(grep -c "download/v${v}/pix_${v}_darwin_" Formula/pix.rb)" = 2
      - name: Audit formula
        # Homebrew misreads the arm64 suffix as version 64 without the explicit
        # version, then audits that required version as redundant.
        run: brew audit --strict --online --except=version local/pix-ci/pix
      - name: Install from this checkout
        run: brew install --formula local/pix-ci/pix
      - name: Verify installed launcher and release bundle
        run: |
          set -euo pipefail
          v="$(brew info --json=v2 --formula pix | jq -r '.formulae[0].versions.stable')"
          test "$(pix version)" = "$v"
          libexec="$(brew --prefix pix)/libexec"
          test "$(jq -r '.version' "$libexec/release-manifest.json")" = "$v"
          expected="$(jq -r '.artifacts.runtime.digest' "$libexec/release-manifest.json")"
          actual="sha256:$(shasum -a 256 "$libexec/pix-runtime-${v}.tar.gz" | awk '{print $1}')"
          test "$actual" = "$expected"
          pix help --all
      - name: Test formula
        run: brew test pix

